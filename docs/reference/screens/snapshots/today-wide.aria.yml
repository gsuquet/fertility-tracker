- banner:
  - button "Creighton FertilityCare System Home": Fertility Tracker
  - tablist "Main Navigation Views":
    - tab "Today" [selected]
    - tab "Paper Chart Strip"
    - tab "Monthly Calendar"
    - tab "Cycle Analytics"
  - button "Filter cycle view": /Cycle 2 \(\d+-\d+-\d+\)/
  - button "Previous Day"
  - text: /Tue, Oct \d+/
  - textbox "Date": /\d+-\d+-\d+/
  - button "Next Day"
  - button "Log"
  - button "Settings"
- main:
  - tabpanel "Today":
    - heading "Today" [level=1]
    - text: /Today Day \d+ Saved/
    - heading "Today's Observation" [level=2]
    - text: Direct Code Entry
    - textbox "Direct Code Entry":
      - /placeholder: e.g. 10KLX3 I AP
      - text: 0AD
    - button "Bleeding None"
    - button "Mucus 0 - Dry"
    - button "Appearance None"
    - button "Frequency AD - All day"
    - button "Symptoms None"
    - switch "I - Sexual Intercourse"
    - switch "Designate Peak Day (P)"
    - button "Notes None"
    - button "Saved" [disabled]
    - text: 0AD
    - paragraph: Dry day. Infertile under the CrMS rules.
    - text: Saved
    - button "Observation actions"
    - region "This cycle":
      - heading "This cycle" [level=2]
      - text: /Day \d+ of \d+ · Peak Day \d+/
      - button "Open the chart"
      - 'img /This cycle: Day \d+ of \d+ · Peak Day \d+/'
    - region "Last 7 days":
      - heading "Last 7 days" [level=2]
      - list:
        - listitem:
          - button /Mon, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Sun, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Sat, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Fri, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Thu, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Wed, Oct \d+ Day \d+ 0AD/
        - listitem:
          - button /Tue, Oct \d+ Day \d+ 0AD I/
- contentinfo "Legal and Trademark Disclaimers":
  - text: /© \d+ Fertility Tracker/
  - button "Legal"
  - button /v\d+\.\d+\.\d+/