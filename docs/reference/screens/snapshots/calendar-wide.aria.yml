- banner:
  - button "Creighton FertilityCare System Home": Fertility Tracker Creighton Model System (CrMS)
  - tablist "Main Navigation Views":
    - tab "Today"
    - tab "Paper Chart Strip"
    - tab "Monthly Calendar" [selected]
    - tab "Cycle Analytics"
  - button "Filter cycle view": /Cycle 2 \(\d+-\d+-\d+\)/
  - button "Log Observation"
  - button "Practitioner PDF / PNG"
  - button "Welcome to Fertility Tracker"
  - button "About & Version Tracker"
  - button "Switch Language": EN
  - button "Toggle Dark/Light Mode"
  - button "Settings"
- main:
  - list "Cycle statistics":
    - listitem:
      - text: Cycle length
      - strong: /\d+/
      - text: /days Sep \d+ – Oct \d+/
    - listitem:
      - text: Peak Day
      - strong: /CD \d+/
      - text: /Oct \d+/
    - listitem:
      - text: Luteal phase
      - strong: /\d+/
      - text: days After Peak Day
    - listitem:
      - text: Intercourse
      - strong: "3"
      - text: days In this cycle
  - tabpanel "Monthly Calendar":
    - heading "Monthly Calendar" [level=1]
    - button "Previous month"
    - heading /October \d+/ [level=2]
    - button "Future months disabled" [disabled]
    - text: Mon Tue Wed Thu Fri Sat Sun
    - button /Date \d+-\d+-\d+, Observation M/: 1 M
    - button /Date \d+-\d+-\d+, Observation L/: 2 L
    - button /Date \d+-\d+-\d+, Observation VL/: 3 VL
    - button /Date \d+-\d+-\d+, Observation 0AD/: 4 0AD
    - button /Date \d+-\d+-\d+, Observation 0AD/: 5 0AD
    - button /Date \d+-\d+-\d+, Observation 0AD/: 6 0AD
    - button /Date \d+-\d+-\d+, Observation 0AD/: 7 0AD
    - button /Date \d+-\d+-\d+, Observation 2CX2/: 8 2CX2
    - button /Date \d+-\d+-\d+, Observation 2CX2/: 9 2CX2
    - button /Date \d+-\d+-\d+, Observation 6C\/KX3, intercourse/: /\d+ 6C\/KX3/
    - button /Date \d+-\d+-\d+, Observation 8KX3/: /\d+ 8KX3/
    - button /Date \d+-\d+-\d+, Observation 10KLAD, Peak Day/: /\d+ 10KLAD/
    - button /Date \d+-\d+-\d+, Observation 0AD, Post-Peak day 1/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD, Post-Peak day 2, intercourse/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD, Post-Peak day 3/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD, intercourse/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, Observation 0AD/ [pressed]: /\d+ 0AD/
    - button /Date \d+-\d+-\d+, No observation/ [disabled]
    - button /Date \d+-\d+-\d+, No observation/ [disabled]
    - button /Date \d+-\d+-\d+, No observation/ [disabled]
    - button /Date \d+-\d+-\d+, No observation/ [disabled]
    - paragraph: "Tinted days: cycle 2. A red edge and C2 mark the first day of a cycle. Under each code: I, P and the Post-Peak count."
    - region "Selected day":
      - paragraph:
        - strong: /Tue, Oct \d+ · Cycle 2, day \d+/
        - text: · 0AD
      - paragraph: Dry day. Infertile under the CrMS rules.
      - paragraph: Saved
      - button "Edit"
      - button "Open in Chart"
      - button "Open in Today"
