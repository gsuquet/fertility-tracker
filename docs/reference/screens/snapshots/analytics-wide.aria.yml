- banner:
  - button "Creighton FertilityCare System Home": Fertility Tracker Creighton Model System (CrMS)
  - tablist "Main Navigation Views":
    - tab "Today"
    - tab "Paper Chart Strip"
    - tab "Monthly Calendar"
    - tab "Cycle Analytics" [selected]
  - button "Filter cycle view": /Cycle 2 \(\d+-\d+-\d+\)/
  - button "Log Observation"
  - button "Practitioner PDF / PNG"
  - button "Welcome to Fertility Tracker"
  - button "About & Version Tracker"
  - button "Switch Language": EN
  - button "Toggle Dark/Light Mode"
  - button "Settings"
- main:
  - list "Cycle statistics":
    - listitem:
      - text: Cycle length
      - strong: /\d+/
      - text: /days Sep \d+ – Oct \d+/
    - listitem:
      - text: Peak Day
      - strong: /CD \d+/
      - text: /Oct \d+/
    - listitem:
      - text: Luteal phase
      - strong: /\d+/
      - text: days After Peak Day
    - listitem:
      - text: Intercourse
      - strong: "3"
      - text: days In this cycle
  - tabpanel "Cycle Analytics":
    - heading "Cycle Analytics" [level=1]
    - heading "Cycle phases" [level=2]
    - 'img /Menses: 4 days, Before Peak Day: 9 days, Post-Peak count: 3 days, After the count: \d+ days/': /4 9 3 \d+/
    - heading "Mucus score trend" [level=2]
    - paragraph: /Score from 0 to \d+ for each cycle day\. The pink bar is Peak Day\./
    - region "Mucus score trend":
      - 'img /Peak Day on cycle day \d+\. Highest score: \d+\./': /1 5 \d+ \d+ \d+ \d+/
    - heading "Stamps in this cycle" [level=2]
    - list:
      - listitem:
        - text: Bleeding
        - strong: "4"
      - listitem:
        - text: Dry
        - strong: /\d+/
      - listitem:
        - text: Fertile mucus
        - strong: "3"
      - listitem:
        - text: Post-Peak count
        - strong: "3"
    - heading "Clinical summary" [level=2]
    - term: Average mucus score
    - definition: "1.1"
    - term: Luteal phase of ended cycles
    - definition: Cycle in progress
    - heading "What is the Creighton Mucus Score?" [level=2]:
      - button "What is the Creighton Mucus Score?"
- contentinfo "Legal and Trademark Disclaimers":
  - text: /© \d+ Fertility Tracker/
  - button "Legal"
  - button /v\d+\.\d+\.\d+/