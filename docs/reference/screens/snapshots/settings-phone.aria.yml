- dialog "Settings":
  - button "Close settings"
  - heading "Settings" [level=2]
  - region "Appearance and input":
    - heading "Appearance and input" [level=3]
    - list:
      - listitem:
        - text: Language
        - combobox "Language":
          - option "English" [selected]
          - option "Français"
      - listitem:
        - group "Theme":
          - text: ""
          - radio "Light" [checked]
          - text: Light
          - radio "Dark"
          - text: Dark
      - listitem:
        - switch "Vibration" [checked]
      - listitem:
        - switch "App icon badge": App icon badge Show a dot on the app icon when today has no observation
      - listitem:
        - switch "Use keyboard shortcuts" [checked]
  - region "Backup and restore":
    - heading "Backup and restore" [level=3]
    - list:
      - listitem:
        - button "Back up now": Back up now No backup yet
      - listitem:
        - button "Back up with a password"
      - listitem:
        - button "Restore from a file"
  - paragraph: "Back up now downloads all your observations as a .ftbackup file. It is plain JSON that any text editor can open. It is not encrypted: keep it private. Back up with a password encrypts the file."
  - region "Sync":
    - heading "Sync" [level=3]
    - list:
      - listitem:
        - button "Turn on sync": Turn on sync Your devices and your partner share an encrypted chart
      - listitem:
        - button "Recover with a code": Recover with a code Use your recovery code on a new device
      - listitem:
        - button "Join with a link": Join with a link Paste the invitation link of your other device
  - region "Help":
    - heading "Help" [level=3]
    - list:
      - listitem:
        - button "Welcome guide"
      - listitem:
        - button "Keyboard shortcuts"
  - region "About":
    - heading "About" [level=3]
    - list:
      - listitem:
        - button "About Fertility Tracker": /About Fertility Tracker Release notes, storage v\d+\.\d+\.\d+/
      - listitem:
        - button "Legal and medical notice"
      - listitem:
        - button "Check for updates"
  - status
  - region "Data":
    - heading "Data" [level=3]
    - list:
      - listitem:
        - button "Load the demo cycles"
      - listitem:
        - button "Delete all data"