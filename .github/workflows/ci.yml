name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain (node, npm, pre-commit, gitleaks)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      # A squash merge uses the pull request title as the commit message.
      - name: Check pull request title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | .mise/tasks/commit-msg

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Scan pull request commits for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gitleaks git --redact --verbose --log-opts="origin/${BASE_REF}..HEAD" .

      - name: Run pre-commit hooks (hygiene, Biome, types)
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run unit tests with code coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npx --no-install vite build

  e2e:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (node, npm)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the pinned Playwright version
        run: npx --no-install playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
