name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (node, npm, pre-commit, gitleaks)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run pre-commit hooks (hygiene, secrets, Biome, types)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run unit tests with code coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npx --no-install vite build
